[project]
name = "aiops-n8n-incident-engine"
version = "0.1.0"
description = "AIOps incident triage: Prometheus alerts in, AI root-cause analysis and n8n routing out."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ali Fakhrabadi" }]
requires-python = ">=3.12,<3.13"
# Dependencies are declared in requirements.in and hash-locked in requirements.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "S",       # bandit (security)
    "ASYNC",   # blocking calls in async code
    "FAST",    # FastAPI
    "DTZ",     # timezone-aware datetimes
    "C4",      # comprehensions
    "SIM",     # simplify
    "RET",     # return statements
    "PIE",
    "PT",      # pytest style
    "T20",     # no print() in application code
    "ERA",     # no commented-out code
    "PERF",
    "PL",      # pylint
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# pytest injects fixtures as arguments and asserts are the point of a test.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]
# The smoke test is a command-line tool: it prints results and runs docker.
"scripts/**" = ["T20", "S603", "S607", "S310"]
# Container tools (screenshots): command-line programs that print what they did.
"tools/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["aiops"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: needs PostgreSQL and Redis (runs when AIOPS_TEST_INTEGRATION=1)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["aiops"]
branch = true
# SQLAlchemy's asyncio layer runs on greenlets; without this, lines after an await
# that touched the database are missed.
concurrency = ["greenlet", "thread"]
# Migrations run through Alembic, not the test suite.
omit = ["*/aiops/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:"]
