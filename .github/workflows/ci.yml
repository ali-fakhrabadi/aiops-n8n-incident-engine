name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment), so a
# moved or compromised tag cannot change what runs in this pipeline.

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, format, types and shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip check

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: ShellCheck
        run: shellcheck scripts/*.sh docker/postgres/initdb/*.sh

      - name: n8n workflow is up to date with its code nodes
        run: python scripts/build_workflow.py --check

      - name: n8n Code node tests (node --test)
        run: |
          node --version
          node --test n8n_workflows/tests/code_nodes.test.mjs

  test:
    name: Tests (PostgreSQL 17, Redis 7)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: aiops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres --dbname=aiops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only, non-secret values for throwaway service containers.
      AIOPS_DB_HOST: localhost
      AIOPS_DB_USER: postgres
      AIOPS_DB_PASSWORD: postgres
      AIOPS_REDIS_HOST: localhost
      AIOPS_TEST_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Models and migrations agree
        run: alembic check

      - name: Run tests with coverage
        run: >-
          pytest --cov --cov-report=term-missing:skip-covered
          --cov-report=xml --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies (hash-verified)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: pip-audit (runtime lock file)
        run: pip-audit --requirement requirements.txt --require-hashes --disable-pip --strict

  stack:
    name: Image scan and end-to-end stack test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality, test, dependency-audit]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      LOCAL_TAG: aiops-n8n-incident-engine:local
      # The whole pipeline, Telegram included, against the fake Bot API: no bot, chat
      # or internet access needed, and Telegram's HTML rules are still enforced.
      COMPOSE_FILE: docker-compose.yml:docker-compose.fake-telegram.yml
      TELEGRAM_CHAT_ID: "100000001"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate secrets and validate the compose files
        run: |
          make env secrets
          # Any token works with the fake API, as long as n8n gets the same one.
          printf '%s:%s' 100000001 "$(openssl rand -hex 20)" > secrets/telegram_bot_token
          docker compose config --quiet
          docker compose --profile dev config --quiet
          COMPOSE_FILE=docker-compose.yml docker compose config --quiet
          COMPOSE_FILE=docker-compose.yml:docker-compose.observability.yml docker compose config --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.LOCAL_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.LOCAL_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Start the stack (migrations, API, n8n) and wait for health checks
        run: docker compose up --detach --no-build --wait --wait-timeout 300

      - name: Smoke test (alert to Telegram, retries included)
        run: python3 scripts/smoke_test.py --fake-telegram

      - name: n8n comes back after a restart of its container
        run: |
          docker compose restart n8n
          docker compose up --detach --no-build --wait --wait-timeout 120 n8n

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 150

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "${IMAGE}"
