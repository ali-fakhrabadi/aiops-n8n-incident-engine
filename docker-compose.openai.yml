# Optional overlay: root-cause analysis with OpenAI or any OpenAI-compatible API
# (vLLM, LM Studio, an internal gateway). Alerts and redacted log lines leave the host.
#
#   1. Put the API key in secrets/openai_api_key (one line, no quotes).
#   2. In .env:
#        COMPOSE_FILE=docker-compose.yml:docker-compose.openai.yml
#        AIOPS_LLM_MODEL=gpt-4o-mini          # or the model your server serves
#        AIOPS_OPENAI_BASE_URL=https://api.openai.com

services:
  worker:
    environment:
      AIOPS_ANALYZER: openai
      AIOPS_OPENAI_BASE_URL: ${AIOPS_OPENAI_BASE_URL:-https://api.openai.com}
      AIOPS_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [aiops_app_db_password, redis_password, openai_api_key]

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key
